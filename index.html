  body { display:flex; flex-direction:column; }
  #header { flex:0 0 auto; padding:6px 8px; background:#f4f4f4; border-bottom:1px solid #ccc; }

  .routeLabel { background:#fff; border:3px solid #333; border-radius:50%;

<script>
// ---- GitHub保存の設定 ----
const GH_OWNER  = 'poncho19900731';
const GH_REPO   = 'rosen-tousa';
const GH_BRANCH = 'main';
const GH_FOLDER = 'results';
const PROGRESS_FILE = 'progress.json';
const LANES_FILE = 'lanes.json';          // 車線記録（progress.jsonとは別）
const LIST_FILE = 'list.json';
const LS_KEY    = 'rosen_progress_v1';
const LS_LANES  = 'rosen_lanes_v1';
const LS_TOKEN  = 'gh_token';

// ---- 踏査判定 ----
const THRESHOLD_M = 15;
const MAX_ACCURACY_M = 25;
const UNIT_M = 50;
const GAP_FILL_UNITS = 3;
const MIN_MOVE_M = 2;             // 座標を記録する最小移動距離
const JOIN_M = 20;
const ADJACENT_M = 30;
const LABEL_DUP_M = 60;
const LABEL_COUNT_MIN = 1;
const LABEL_INTERVAL_M = 1000;
const LINE_WEIGHT = 6;
const LINE_OPACITY = 0.85;
const COLORS = [
  '#e6194b','#3cb44b','#4363d8','#f58231','#911eb4',
  '#008b8b','#9a6324','#d2007a','#808000','#000075',
  '#46a0f0','#f032e6','#7fb800','#800000','#555555'
];
const TRACK_COLOR = '#000000';
const TRACK_WEIGHT = 5;
const ZONE_NEAR_M = 15;

// ---- 車線 ----
const LANE_WIDTH_M = 3.5;         // 車線1本の幅(m)
const LANE_FRAME_COLOR = '#555555';
const LANE_WALKED_COLOR = '#ffd400';   // 走行した車線（黄色）
const LANE_ROW_M = 5;             // 行の区切りの幅(m)
const LANE_DETAIL_ZOOM = 17;      // このズーム以上で車線枠を描く

// ---- 区間の種別（工事・迂回）----
const ZONE_TYPES = {
  construction: {label:'工事', color:'#8d6e63'},
  detour:       {label:'迂回', color:'#ffb347'}
};
const ZONE_EDGE = '#555555';

function getToken(){
  let t = localStorage.getItem(LS_TOKEN) || '';
  if(t) return t;
  t = prompt('GitHubのトークン（github_pat_...）を貼り付けてください。\n（一度入力すると、この端末に記憶されます）');
  t = t ? t.trim() : '';
  if(t) localStorage.setItem(LS_TOKEN, t);
  return t;
}

// ================= 状態 =================
let segments = [];
let surveying = false;
let posWatchId = null;
let trackPoints = [];
let trackLines = [];
let currentRun = null;
let passLayers = [];
let startTime = null;
let currentMarker = null;
let lastUnits = new Map();
let followMe = false;
let wakeLock = null;
let zones = [];
let activeZone = null;
let zoneLayers = [];

// 車線の状態
let laneCount = 0;        // 選択中の車線数（0＝未選択）
let laneNo = 0;           // 選択中の車線No（0＝未選択）
let laneData = {};        // lanes.json の中身  {路線ライン名: {units:{...}, rows:[...]}}
let laneFrameLayers = [];
let laneWalkLayers = [];

// ================= 地図 =================
const map = L.map('map').setView([24.78, 125.33], 11);
map.createPane('routePane');   map.getPane('routePane').style.zIndex = 400;
map.createPane('walkedPane');  map.getPane('walkedPane').style.zIndex = 450;
map.createPane('labelPane');   map.getPane('labelPane').style.zIndex = 500;
map.createPane('lanePane');    map.getPane('lanePane').style.zIndex = 700;
map.createPane('zonePane');    map.getPane('zonePane').style.zIndex = 800;
map.createPane('trackPane');   map.getPane('trackPane').style.zIndex = 900;
map.createPane('currentPane'); map.getPane('currentPane').style.zIndex = 950;

const baseLayers = {
  '淡色地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'地理院タイル', maxZoom:18}),
  '標準地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:'地理院タイル', maxZoom:18}),
  '航空写真': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{attribution:'地理院タイル', maxZoom:18}),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors', maxZoom:19})
};
baseLayers['淡色地図'].addTo(map);
L.control.layers(baseLayers, null, {position:'topright'}).addTo(map);

if(window.ResizeObserver){
  new ResizeObserver(()=> map.invalidateSize()).observe(document.getElementById('header'));
}
window.addEventListener('resize', ()=> map.invalidateSize());

// ================= 便利関数 =================
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDT(d){ return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(d){ return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; }
function fmtTime(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtStamp(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function stripBom(s){ return s.replace(/^\uFEFF/, ''); }
function endpoints(line){ const c = line.geometry.coordinates; return [c[0], c[c.length-1]]; }
function dist(a, b){ return turf.distance(turf.point(a), turf.point(b), {units:'meters'}); }
// ================= KML解析 =================
function parseKmlText(text){
  const xml = new DOMParser().parseFromString(stripBom(text),'text/xml');
  if(xml.querySelector('parsererror')) throw new Error('KMLの形式が不正です');
  const geojson = toGeoJSON.kml(xml);
  const lines = [];
  geojson.features.forEach((f,i)=>{
    if(!f.geometry) return;
    const name = f.properties.name || ('route_'+(i+1));
    if(f.geometry.type==='LineString'){
      lines.push({name, coords:f.geometry.coordinates});
    }else if(f.geometry.type==='MultiLineString'){
      f.geometry.coordinates.forEach(c=>lines.push({name, coords:c}));
    }
  });
  return lines;
}
function baseName(name){
  return name.replace(/（way\s*\d+）/g,'').replace(/\(way\s*\d+\)/g,'').replace(/_\d+\s*$/,'').trim();
}

function joinParts(parts){
  let pool = parts.map(p=>p.slice());
  let result = pool.shift();
  let progressed = true;
  while(pool.length && progressed){
    progressed = false;
    for(let i=0; i<pool.length; i++){
      const p = pool[i];
      const rs = result[0], re = result[result.length-1];
      const ps = p[0], pe = p[p.length-1];
      let merged = null;
      if(dist(re, ps) <= JOIN_M)      merged = result.concat(p.slice(1));
      else if(dist(re, pe) <= JOIN_M) merged = result.concat(p.slice(0,-1).reverse());
      else if(dist(rs, pe) <= JOIN_M) merged = p.concat(result.slice(1));
      else if(dist(rs, ps) <= JOIN_M) merged = p.slice().reverse().concat(result.slice(1));
      if(merged){ result = merged; pool.splice(i,1); progressed = true; break; }
    }
  }
  return [result].concat(pool);
}

// ================= KML読み込み =================
async function loadAll(){
  const info = document.getElementById('info');
  let names;
  try{
    const res = await fetch(LIST_FILE + '?t=' + Date.now());
    if(!res.ok) throw new Error('list.json が見つかりません（HTTP ' + res.status + '）');
    names = JSON.parse(stripBom(await res.text()));
  }catch(e){
    info.textContent = 'list.json の読み込みに失敗：' + e.message;
    return;
  }
  if(!Array.isArray(names) || !names.length){
    info.textContent = 'list.json にKMLが登録されていません';
    return;
  }
  const byRoute = {};
  const errors = [];
  let count = 0;
  for(const fname of names){
    count++;
    info.textContent = `読み込み中... ${count} / ${names.length}`;
    try{
      const res = await fetch(encodeURI(fname) + '?t=' + Date.now());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const lines = parseKmlText(stripBom(await res.text()));
      if(!lines.length) throw new Error('線が見つかりません');
      lines.forEach(o=>{
        const r = baseName(o.name);
        byRoute[r] = byRoute[r] || {parts:[], files:new Set()};
        byRoute[r].parts.push(o.coords);
        byRoute[r].files.add(fname);
      });
    }catch(e){
      errors.push(fname + '：' + e.message);
    }
  }
  const list = [];
  Object.keys(byRoute).forEach(route=>{
    const joined = joinParts(byRoute[route].parts);
    joined.forEach((coords, k)=>{
      const line = turf.lineString(coords);
      const len = turf.length(line,{units:'meters'});
      const unitCount = Math.max(1, Math.ceil(len / UNIT_M));
      list.push({
        route: route,
        part: joined.length > 1 ? `${route}_${k+1}` : route,
        file: [...byRoute[route].files].join(' / '),
        line: line, bbox: turf.bbox(line), length: len,
        unitCount: unitCount,
        unitWalked: new Array(unitCount).fill(false),
        unitDone: 0, layer: null, walkedLayers: [], walked: false, color: '#999'
      });
    });
  });
  segments = list;
  info.textContent = '地図を作成中...';
  buildMap();
  restoreProgress();
  await loadRemoteProgress();
  await initLanes();
  if(errors.length) alert('読み込めなかったKML\n' + errors.join('\n'));
}
// ================= 色分け =================
function isAdjacent(a, b){
  if(a.route === b.route) return false;
  const ea = endpoints(a.line), eb = endpoints(b.line);
  for(const pa of ea) for(const pb of eb){ if(dist(pa,pb) <= ADJACENT_M) return true; }
  for(const pa of ea){
    const near = turf.nearestPointOnLine(b.line, turf.point(pa), {units:'meters'});
    if(near.properties.dist <= ADJACENT_M) return true;
  }
  for(const pb of eb){
    const near = turf.nearestPointOnLine(a.line, turf.point(pb), {units:'meters'});
    if(near.properties.dist <= ADJACENT_M) return true;
  }
  return false;
}
function assignColors(){
  const routeMap = {};
  segments.forEach((s,i)=>{ (routeMap[s.route] = routeMap[s.route] || []).push(i); });
  const routeNames = Object.keys(routeMap);
  const adj = {};
  routeNames.forEach(r=>adj[r] = new Set());
  for(let a=0; a<routeNames.length; a++){
    for(let b=a+1; b<routeNames.length; b++){
      const ra = routeNames[a], rb = routeNames[b];
      let touch = false;
      for(const i of routeMap[ra]){
        for(const j of routeMap[rb]){
          if(isAdjacent(segments[i], segments[j])){ touch = true; break; }
        }
        if(touch) break;
      }
      if(touch){ adj[ra].add(rb); adj[rb].add(ra); }
    }
  }
  const order = routeNames.slice().sort((x,y)=>adj[y].size - adj[x].size);
  const colorOf = {};
  order.forEach(r=>{
    const used = new Set();
    adj[r].forEach(n=>{ if(colorOf[n] !== undefined) used.add(colorOf[n]); });
    let c = 0;
    while(used.has(c)) c++;
    colorOf[r] = c;
  });
  segments.forEach(s=>{
    s.colorIdx = colorOf[s.route];
    s.color = COLORS[s.colorIdx % COLORS.length];
  });
}

function makeLabel(lat, lng, num, color, isEnd){
  const size = isEnd ? 30 : 22;
  return L.marker([lat,lng],{
    pane:'labelPane',
    icon:L.divIcon({className:'',
      html:`<div class="routeLabel ${isEnd?'endLabel':'midLabel'}" style="border-color:${color}">${esc(num)}</div>`,
      iconSize:[size,size]}),
    interactive:false
  });
}
function unitLatLngs(s, idx){
  const from = idx * UNIT_M;
  const to = Math.min((idx + 1) * UNIT_M, s.length);
  if(to <= from) return [];
  const part = turf.lineSliceAlong(s.line, from/1000, to/1000, {units:'kilometers'});
  return part.geometry.coordinates.map(c=>[c[1],c[0]]);
}

function buildMap(){
  segments.forEach(s=>{
    if(s.layer) map.removeLayer(s.layer);
    s.walkedLayers.forEach(l=>{ if(l) map.removeLayer(l); });
    s.walkedLayers = [];
  });
  if(window._labelGroup){ map.removeLayer(window._labelGroup); window._labelGroup = null; }
  assignColors();

  const labelItems = [];
  segments.forEach(s=>{
    const num = (s.route.match(/(\d+)/)||[,''])[1] || s.route.slice(0,2);
    const len = s.length;
    const eps = endpoints(s.line);
    labelItems.push({p:eps[0], num, route:s.route, color:s.color, isEnd:true});
    if(dist(eps[0], eps[1]) > ADJACENT_M){
      labelItems.push({p:eps[1], num, route:s.route, color:s.color, isEnd:true});
    }
    const n = Math.max(LABEL_COUNT_MIN, Math.round(len / LABEL_INTERVAL_M) - 1);
    for(let k=1; k<=n; k++){
      const d = len * k / (n + 1);
      const p = turf.along(s.line, d, {units:'meters'}).geometry.coordinates;
      labelItems.push({p, num, route:s.route, color:s.color, isEnd:false});
    }
  });
  const kept = [];
  labelItems.sort((a,b)=> (b.isEnd?1:0) - (a.isEnd?1:0));
  labelItems.forEach(it=>{
    const dup = kept.some(k=> k.route === it.route && dist(k.p, it.p) <= LABEL_DUP_M);
    if(!dup) kept.push(it);
  });
  const labelGroup = L.layerGroup();
  kept.forEach(it=> makeLabel(it.p[1], it.p[0], it.num, it.color, it.isEnd).addTo(labelGroup));
  window._labelGroup = labelGroup.addTo(map);

  segments.forEach(s=>{
    const latlngs = s.line.geometry.coordinates.map(c=>[c[1],c[0]]);
    s.layer = L.polyline(latlngs,{pane:'routePane', color:s.color, weight:LINE_WEIGHT, opacity:LINE_OPACITY}).addTo(map);
    s.walkedLayers = new Array(s.unitCount).fill(null);
  });
  if(segments.length){
    map.fitBounds(L.featureGroup(segments.map(s=>s.layer)).getBounds());
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnSave').disabled = false;
  }
  updateInfo();
}

function updateInfo(){
  const el = document.getElementById('info');
  const routeCount = new Set(segments.map(s=>s.route)).size;
  let done = 0, totalUnits = 0, doneUnits = 0;
  segments.forEach(s=>{
    if(s.walked) done++;
    totalUnits += s.unitCount;
    doneUnits += s.unitDone || 0;
  });
  el.textContent = `路線 ${routeCount} 本 / ライン ${segments.length} / 全線踏査済み ${done} / 踏査済み ${doneUnits}/${totalUnits} 小区間` + (surveying ? ' ［調査中］' : '');
}
// ================= 踏査記録 =================
function collectProgress(){
  const out = {};
  segments.forEach(s=>{
    const arr = [];
    s.unitWalked.forEach((v,i)=>{ if(v) arr.push(i); });
    if(arr.length) out[s.part] = {units:arr, count:s.unitCount};
  });
  return out;
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(collectProgress())); }catch(e){} }
function applyProgress(data){
  segments.forEach(s=>{
    s.unitWalked = new Array(s.unitCount).fill(false);
    s.unitDone = 0;
    s.walked = false;
    s.walkedLayers.forEach(l=>{ if(l) map.removeLayer(l); });
    s.walkedLayers = new Array(s.unitCount).fill(null);
  });
  segments.forEach(s=>{
    const rec = data && data[s.part];
    if(!rec || rec.count !== s.unitCount) return;
    rec.units.forEach(i=> markUnit(s, i, true));
  });
  updateInfo();
}
function restoreProgress(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) applyProgress(JSON.parse(raw)); }catch(e){}
}
async function loadRemoteProgress(){
  try{
    const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FOLDER}/${PROGRESS_FILE}?t=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) return;
    applyProgress(JSON.parse(await res.text()));
    saveLocal();
  }catch(e){}
}

function markUnit(s, idx, silent){
  if(idx < 0 || idx >= s.unitCount) return;
  if(s.unitWalked[idx]) return;
  s.unitWalked[idx] = true;
  s.unitDone = (s.unitDone || 0) + 1;
  const ll = unitLatLngs(s, idx);
  if(ll.length >= 2){
    const pl = L.polyline(ll,{pane:'walkedPane', color:s.color, weight:LINE_WEIGHT+2, opacity:1}).addTo(map);
    pl.on('click', ()=> askDeleteUnit(s, idx));
    s.walkedLayers[idx] = pl;
  }
  if(s.unitDone >= s.unitCount) s.walked = true;
  if(!silent) saveLocal();
}
function unmarkUnit(s, idx){
  if(!s.unitWalked[idx]) return;
  s.unitWalked[idx] = false;
  s.unitDone = Math.max(0, (s.unitDone||0) - 1);
  s.walked = false;
  if(s.walkedLayers[idx]){ map.removeLayer(s.walkedLayers[idx]); s.walkedLayers[idx] = null; }
}
function askDeleteUnit(s, idx){
  if(!confirm('この踏査済みラインを削除しますか？\n（この周辺の連続した踏査済み部分をまとめて削除します）')) return;
  let a = idx, b = idx;
  while(a-1 >= 0 && s.unitWalked[a-1]) a--;
  while(b+1 < s.unitCount && s.unitWalked[b+1]) b++;
  for(let k=a; k<=b; k++) unmarkUnit(s, k);
  saveLocal();
  updateInfo();
}

// =====================================================================
// 車線機能
// laneData の構造
//   laneData[ライン名] = {
//     count: 車線数,
//     walked: { "fwd1": [小区間番号,...], ..., "bwd4": [...] },   // 黄色線用
//     rows: [ {key:区切り番号, fwd:[null|"HH:MM:SS" x4], bwd:[... x4], lat, lng} ]
//   }
// =====================================================================

function laneKey(dir, no){ return (dir === 'fwd' ? 'fwd' : 'bwd') + no; }

// 現在選んだ車線数・車線Noが有効か
function laneReady(){ return laneCount >= 2 && laneNo >= 1 && laneNo <= laneCount; }

// 往路＝KMLの向き。直近の進行方向から判定（loc が増えれば往路）
function judgeDir(prevLoc, loc){
  if(prevLoc === null || prevLoc === undefined) return null;
  if(Math.abs(loc - prevLoc) < 0.5) return null;
  return loc > prevLoc ? 'fwd' : 'bwd';
}

// 画面下部ボタン
document.querySelectorAll('.laneCnt').forEach(b=>{
  b.addEventListener('click', ()=>{
    const n = Number(b.dataset.n);
    laneCount = (laneCount === n) ? 0 : n;   // もう一度押すと解除
    laneNo = 0;
    updateLaneButtons();
    renderLaneFrames();

});
document.querySelectorAll('.laneNo').forEach(b=>{
  b.addEventListener('click', ()=>{
    const n = Number(b.dataset.no);
    laneNo = (laneNo === n) ? 0 : n;

});
function updateLaneButtons(){
  document.querySelectorAll('.laneCnt').forEach(b=>{

  });

// ---- 枠の描画：往路は左に往1〜往4、復路は右に復4〜復1（中心線を挟んで左右対称）----
function laneOffset(dir, no){
  // 中心線から外側へ no 番目。往路は左(−)、復路は右(＋)
  const d = LANE_WIDTH_M * (no - 0.5);
  return dir === 'fwd' ? -d : d;
}
function offsetLine(coords, offsetM){
  if(coords.length < 2) return coords;
  try{
    const l = turf.lineString(coords);
    return turf.lineOffset(l, offsetM/1000, {units:'kilometers'}).geometry.coordinates;
  }catch(e){ return coords; }
}

function clearLaneFrames(){
  laneFrameLayers.forEach(l=> map.removeLayer(l));
  laneFrameLayers = [];
}
function renderLaneFrames(){
  clearLaneFrames();
  if(laneCount < 2) return;                    // 車線数を選ぶまで描かない
  if(map.getZoom() < LANE_DETAIL_ZOOM) return;
  const half = Math.ceil(laneCount / 2);       // 片側の本数（往路・復路）
  const bounds = map.getBounds().pad(0.2);
  segments.forEach(s=>{
    const b = s.bbox;
    if(b[2] < bounds.getWest() || b[0] > bounds.getEast() ||
       b[3] < bounds.getSouth() || b[1] > bounds.getNorth()) return;
    const base = s.line.geometry.coordinates;
    ['fwd','bwd'].forEach(dir=>{
      for(let no=1; no<=half; no++){
        const line = offsetLine(base, laneOffset(dir, no)).map(c=>[c[1],c[0]]);
        laneFrameLayers.push(L.polyline(line,{
          pane:'lanePane', color:LANE_FRAME_COLOR, weight:1.5, opacity:0.8, dashArray:'4 4'
        }).addTo(map));
      }
    });
  });
}
map.on('zoomend moveend', ()=>{ renderLaneFrames(); renderLaneWalked(); });

// ---- 黄色線：走行中の車線だけ、50m小区間ごとに追加 ----
function renderLaneWalked(){
  laneWalkLayers.forEach(l=> map.removeLayer(l));
  laneWalkLayers = [];
  if(laneCount < 2) return;
  if(map.getZoom() < LANE_DETAIL_ZOOM) return;
  segments.forEach(s=>{
    const rec = laneData[s.part];
    if(!rec || rec.count !== laneCount) return;
    Object.keys(rec.walked || {}).forEach(k=>{
      const dir = k.startsWith('fwd') ? 'fwd' : 'bwd';
      const no = Number(k.slice(3));
      rec.walked[k].forEach(idx=>{
        const ll = unitLatLngs(s, idx);
        if(ll.length < 2) return;
        const coords = ll.map(c=>[c[1],c[0]]);
        const off = offsetLine(coords, laneOffset(dir, no)).map(c=>[c[1],c[0]]);
        laneWalkLayers.push(L.polyline(off,{
          pane:'lanePane', color:LANE_WALKED_COLOR, weight:5, opacity:0.95
        }).addTo(map));
      });
    });
  });
}

// ---- 走行の記録（位置を受け取るたびに呼ぶ）----
let laneLastLoc = new Map();   // ライン→直前の位置(m)
function recordLane(hits, lat, lng, time){
  if(!laneReady()) return;
  hits.forEach(h=>{
    const s = h.seg;
    const prev = laneLastLoc.get(s);
    const dir = judgeDir(prev, h.loc);
    laneLastLoc.set(s, h.loc);
    if(!dir) return;
    const key = laneKey(dir, laneNo);

    const rec = laneData[s.part] = laneData[s.part] || {count: laneCount, walked:{}, rows:[]};
    if(rec.count !== laneCount) return;       // 車線数が違う記録とは混ぜない
    rec.walked[key] = rec.walked[key] || [];

    // 黄色線：小区間を追加
    const idx = Math.min(s.unitCount - 1, Math.floor(h.loc / UNIT_M));
    if(!rec.walked[key].includes(idx)){
      rec.walked[key].push(idx);
      renderLaneWalked();
    }

    // Excel用の行：同じ断面（行の区切り）・同じ方向で、空いている最初の行に入れる
    const rowKey = Math.floor(h.loc / LANE_ROW_M);
    const col = laneNo - 1;
    let target = null;
    for(const r of rec.rows){
      if(r.key === rowKey && !r[dir][col]){ target = r; break; }
    }
    if(!target){
      target = {key:rowKey, fwd:[null,null,null,null], bwd:[null,null,null,null], lat, lng};
      rec.rows.push(target);
    }
    target[dir][col] = fmtTime(time);       // 最初の点だけ（空いている所にだけ入れる）
  });
  saveLanesLocal();
}

// ---- lanes.json の保存・読み込み（progress.jsonとは別）----
function saveLanesLocal(){ try{ localStorage.setItem(LS_LANES, JSON.stringify(laneData)); }catch(e){} }

function lanesApiGet(token){

}

async function uploadLanes(token){

  const headers = {'Authorization':'Bearer ' + token,'Accept':'application/vnd.github+json'};
  let sha = null;
  const cur = await lanesApiGet(token);
  if(cur.ok){ sha = (await cur.json()).sha; }
  const body = {message:'車線記録を更新', content:textToBase64(JSON.stringify(laneData)), branch:GH_BRANCH};
  if(sha) body.sha = sha;
  const res = await fetch(apiUrl(path), {
    method:'PUT', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok){
    let detail = '';

}

// 複製名：lanes_年月日_時刻_ナンバー.json（括弧なし）
function laneCopyName(no){
  const d = new Date();
  return `lanes_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}_${no}.json`;
}

// 起動時：引き継ぐか確認。「いいえ」なら複製して保存し、空のlanes.jsonから始める
async function initLanes(){
  let remote = null;
  try{
    const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FOLDER}/${LANES_FILE}?t=${Date.now()}`;
    const res = await fetch(url);
    if(res.ok) remote = JSON.parse(await res.text());
  }catch(e){}

  if(!remote || !Object.keys(remote).length){
    laneData = {};
    renderLaneFrames(); renderLaneWalked();
    return;
  }
  if(confirm('前回の車線記録（lanes.json）があります。\n引き継ぎますか？\n\n［OK］引き継ぐ　［キャンセル］引き継がない（複製して保存し、新しく始める）')){
    laneData = remote;
    saveLanesLocal();
  }else{
    const token = getToken();
    if(token){
      try{
        // ナンバーは、同じ日時の複製が重ならないよう連番にする
        let no = 1;
        const copyBody = textToBase64(JSON.stringify(remote));
        for(; no <= 99; no++){
          const name = laneCopyName(no);
          const p = `${GH_FOLDER}/${name}`;
          const chk = await fetch(apiUrl(p) + '?ref=' + GH_BRANCH + '&t=' + Date.now(),
            {headers:{'Authorization':'Bearer ' + token,'Accept':'application/vnd.github+json'}});
          if(chk.status === 404){
            const r = await fetch(apiUrl(p), {
              method:'PUT',
              headers:{'Authorization':'Bearer ' + token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
              body: JSON.stringify({message:`車線記録を複製：${name}`, content:copyBody, branch:GH_BRANCH})
            });
            if(!r.ok) throw new Error('複製に失敗（HTTP ' + r.status + '）');
            break;
          }
        }
        laneData = {};
        await uploadLanes(token);              // 空のlanes.jsonを新しく作る
        saveLanesLocal();
      }catch(e){
        alert('複製の保存に失敗：' + e.message + '\n既存の記録をそのまま使います。');
        laneData = remote;
      }
    }else{
      alert('トークン未入力のため、既存の記録を引き継ぎます。');
      laneData = remote;
    }
  }
  renderLaneFrames(); renderLaneWalked();
}
// ================= 調査開始・終了 =================
function startSurvey(){
  if(!navigator.geolocation){ alert('この端末は位置情報に対応していません。'); return; }
  surveying = true;
  startTime = new Date();
  lastUnits = new Map();
  laneLastLoc = new Map();
  currentRun = {points:[]};
  trackLines.push(currentRun);
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnEnd').disabled = false;
  updateInfo();
  requestWakeLock();
  startPositionWatch();
}
document.getElementById('btnStart').addEventListener('click', startSurvey);

function findAllNearby(pt){
  const [x, y] = pt.geometry.coordinates;
  const marginY = (THRESHOLD_M * 1.5) / 111000;
  const marginX = marginY / Math.max(0.2, Math.cos(y * Math.PI / 180));
  const hits = [];
  segments.forEach(s=>{
    const b = s.bbox;
    if(x < b[0] - marginX || x > b[2] + marginX || y < b[1] - marginY || y > b[3] + marginY) return;
    const np = turf.nearestPointOnLine(s.line, pt, {units:'meters'});
    const d = np.properties.dist;
    if(d > THRESHOLD_M) return;
    hits.push({seg:s, dist:d, loc:np.properties.location});
  });
  return hits;
}

function onPosition(pos){
  const {latitude:lat, longitude:lng, accuracy} = pos.coords;
  if(accuracy > MAX_ACCURACY_M) return;

  if(!currentMarker){
    currentMarker = L.marker([lat,lng],{
      pane:'currentPane',
      icon:L.divIcon({className:'', html:'<div class="currentDot"></div>', iconSize:[22,22], iconAnchor:[11,11]}),
      interactive:false, zIndexOffset:10000
    }).addTo(map);
  }else{
    currentMarker.setLatLng([lat,lng]);
  }
  if(followMe) map.panTo([lat,lng]);
  if(!surveying || !currentRun) return;

  const hits = findAllNearby(turf.point([lng,lat]));
  const routeNames = [...new Set(hits.map(h=>h.seg.route))];
  const routeText = routeNames.length ? routeNames.join(' / ') : '路線外';

  const pts = currentRun.points;
  const last = pts[pts.length-1];
  const changed = !last || dist([last.lng, last.lat], [lng, lat]) >= MIN_MOVE_M;
  if(changed){
    const time = new Date(pos.timestamp);
    const rec = {lat, lng, time, accuracy, route:routeText};
    pts.push(rec);
    trackPoints.push(rec);
    renderPassLines();
    renderList();
    judgeRoadState(lat, lng);
    recordLane(hits, lat, lng, time);       // 車線の記録
  }
  hits.forEach(h=>{
    const s = h.seg;
    const idx = Math.min(s.unitCount - 1, Math.floor(h.loc / UNIT_M));
    judgeUnit(s, idx);
  });
  updateInfo();
}

function judgeUnit(s, idx){
  const prev = lastUnits.get(s);
  if(prev !== undefined){
    const diff = idx - prev;
    if(Math.abs(diff) <= 1){
      markUnit(s, prev);
      markUnit(s, idx);
    }else if(Math.abs(diff) <= GAP_FILL_UNITS){
      const from = Math.min(prev, idx);
      const to = Math.max(prev, idx);
      for(let k = from; k <= to; k++) markUnit(s, k);
    }
  }
  lastUnits.set(s, idx);
}

function stopTracking(){
  surveying = false;
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  lastUnits = new Map();
  laneLastLoc = new Map();
  currentRun = null;
  if(activeZone){
    activeZone = null;
    resetZoneButtons();
    setStatus('');
  }
}
document.getElementById('btnEnd').addEventListener('click', async()=>{
  if(!confirm('調査を終了してGitHubへ保存しますか？')) return;
  const endTime = new Date();
  const savedTrack = trackPoints.slice();
  stopTracking();
  saveLocal();
  saveLanesLocal();
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnEnd').disabled = true;
  updateInfo();

  const stamp = fmtStamp(startTime);
  const kmlName  = `踏査軌跡_${stamp}.kml`;
  const xlsxName = `踏査結果_${stamp}.xlsx`;
  const kmlBlob  = new Blob([buildKml(startTime,endTime)],{type:'application/vnd.google-earth.kml+xml'});
  const xlsxBlob = buildXlsx(startTime, endTime, kmlName, xlsxName, savedTrack);

  const info = document.getElementById('info');
  const token = getToken();
  if(!token){
    info.textContent = 'トークン未入力のため、保存しませんでした';
    alert('トークン未入力のため、保存しませんでした。');
    return;
  }
  info.textContent = 'GitHubに保存中...';
  try{
    await uploadToGitHub(kmlName,  kmlBlob,  token);
    await uploadToGitHub(xlsxName, xlsxBlob, token);
    await uploadProgress(token);
    await uploadLanes(token);
    info.textContent = `GitHubに保存しました（${GH_REPO} / ${GH_FOLDER}フォルダ）`;
  }catch(e){
    if(String(e.message).includes('401')) localStorage.removeItem(LS_TOKEN);
    info.textContent = 'GitHub保存に失敗：' + e.message;
    alert('GitHub保存に失敗：' + e.message);
  }
});

document.getElementById('btnSave').addEventListener('click', async()=>{

function lastPoint(){
  if(!currentRun || !currentRun.points.length) return null;
  return currentRun.points[currentRun.points.length-1];
}
function setStatus(text){
  const el = document.getElementById('status');

function openChoice(title, options){
  return new Promise(resolve=>{
    const back = document.getElementById('dlgBack');
    const sel  = document.getElementById('dlgSel');
    document.getElementById('dlgTitle').textContent = title;
    sel.innerHTML = options.map(o=>`<option value="${esc(o.value)}">${esc(o.text)}</option>`).join('');

async function toggleZone(type, btn, label, askOption){
  if(!surveying){ alert('調査中のみ記録できます。'); return; }
  const p = lastPoint();
  if(!p){ alert('現在地を取得中です。少し待ってから押してください。'); return; }
  if(!activeZone){
    const option = askOption ? await askOption() : '';
    if(option === null) return;
    const q = lastPoint() || p;
    activeZone = {
      type, option,
      startTime:q.time, startLat:q.lat, startLng:q.lng,
      startIdx: currentRun.points.length - 1,
      run: currentRun
    };
    btn.textContent = label + ' 終了';
    btn.classList.add('rec');
    setStatus(`${label} 記録中`);
  }else if(activeZone.type === type){
    const z = activeZone;
    z.endTime = p.time; z.endLat = p.lat; z.endLng = p.lng;
    z.points = z.run.points.slice(z.startIdx).map(q=>[q.lng,q.lat]);
    if(z.points.length < 2){
      z.points = [[z.startLng,z.startLat],[z.endLng,z.endLat]];
    }
    zones.push(z);
    activeZone = null;
    btn.textContent = label + ' 開始';
    btn.classList.remove('rec');
    setStatus('');
    renderZones();
  }else{
    alert('他の区間を記録中です。先に終了してください。');
  }
}

// ================= 現在地の道路状態（工事・迂回の近傍判定）=================
function judgeRoadState(lat, lng){
  if(activeZone) return;
  const p = [lng, lat];
  for(const z of zones){
    for(const c of z.points){
      if(dist(p, c) <= ZONE_NEAR_M){
        setStatus(`${ZONE_TYPES[z.type].label}区間の付近です`);
        return;
      }
    }
  }
  setStatus('');
}

// ================= 出力 =================
function buildKml(st, en){
  let body = '';
  trackLines.forEach((r,i)=>{
    if(r.points.length < 2) return;
    const coords = r.points.map(p=>`${p.lng},${p.lat},0`).join(' ');
    body += `<Placemark><name>踏査軌跡${i+1}</name>` +
      `<Style><LineStyle><color>ff000000</color><width>4</width></LineStyle></Style>` +
      `<LineString><tessellate>1</tessellate><coordinates>${coords}</coordinates></LineString></Placemark>\n`;
  });
  zones.forEach((z,i)=>{
    const coords = z.points.map(c=>`${c[0]},${c[1]},0`).join(' ');
    body += `<Placemark><name>${esc(zoneInfoText(z))}${i+1}</name>` +
      `<description>${fmtDT(z.startTime)} - ${fmtDT(z.endTime)}</description>` +
      `<LineString><tessellate>1</tessellate><coordinates>${coords}</coordinates></LineString></Placemark>\n`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>踏査軌跡_${fmtStamp(st)}</name>
<description>開始 ${fmtDT(st)} / 終了 ${fmtDT(en)}</description>
${body}</Document></kml>`;
}

function buildXlsx(st, en, kmlName, xlsxName, track){
  const minutes = Math.round((en - st) / 60000);
  const files = [...new Set(segments.map(s=>s.file))];
  const touched = segments.filter(s=>(s.unitDone||0) > 0).length;

  const summary = [
    ['項目','内容'],
    ['保存ファイル名（Excel）', xlsxName],
    ['保存ファイル名（軌跡KML）', kmlName],
    ['調査開始', fmtDT(st)],
    ['調査終了', fmtDT(en)],
    ['所要時間（分）', minutes],
    ['記録した点の数', track.length],
    ['路線数', new Set(segments.map(s=>s.route)).size],
    ['ライン数', segments.length],
    ['全線踏査済みのライン数', segments.filter(s=>s.walked).length],
    ['一部でも踏査したライン数', touched],
    ['工事の記録数', zones.filter(z=>z.type==='construction').length],
    ['迂回の記録数', zones.filter(z=>z.type==='detour').length],
    ['使用したKML', files.join(' / ')]
  ];

  const detail = [['路線名','ライン名','元のKMLファイル','延長(m)','小区間数','踏査済み小区間','踏査率(%)','踏査結果']];
  segments.forEach(s=>{
    const doneU = s.unitDone || 0;
    const rate = Math.round(doneU / s.unitCount * 100);
    const result = s.walked ? '踏査済み' : (doneU > 0 ? '一部踏査' : '未踏査');
    detail.push([s.route, s.part, s.file, Math.round(s.length), s.unitCount, doneU, rate, result]);
  });

  const trk = [['No','日付','時刻','緯度','経度','精度(m)','路線']];
  track.forEach((p,i)=>{
    trk.push([i+1, fmtDate(p.time), fmtTime(p.time), p.lat, p.lng, Math.round(p.accuracy), p.route]);
  });

  const zn = [['種別','理由','開始日時','開始緯度','開始経度','終了日時','終了緯度','終了経度']];
  zones.forEach(z=>{
    zn.push([ZONE_TYPES[z.type].label, z.option || '',
      `${fmtDate(z.startTime)} ${fmtTime(z.startTime)}`, z.startLat, z.startLng,
      `${fmtDate(z.endTime)} ${fmtTime(z.endTime)}`, z.endLat, z.endLng]);
  });

  // 車線シート：往1〜往4 と 復1〜復4 を別の列に分ける
  const ln = [['ライン名','車線数','区切り(5m)','緯度','経度',
               '往1','往2','往3','往4','復1','復2','復3','復4']];
  Object.keys(laneData).forEach(part=>{
    const rec = laneData[part];
    (rec.rows || []).slice().sort((a,b)=>a.key-b.key).forEach(r=>{
      ln.push([part, rec.count, r.key, r.lat, r.lng,
        r.fwd[0]||'', r.fwd[1]||'', r.fwd[2]||'', r.fwd[3]||'',
        r.bwd[0]||'', r.bwd[1]||'', r.bwd[2]||'', r.bwd[3]||'']);
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  const ws2 = XLSX.utils.aoa_to_sheet(detail);
  const ws3 = XLSX.utils.aoa_to_sheet(trk);
  const ws4 = XLSX.utils.aoa_to_sheet(zn);
  const ws5 = XLSX.utils.aoa_to_sheet(ln);
  ws1['!cols'] = [{wch:28},{wch:60}];
  ws2['!cols'] = [{wch:24},{wch:34},{wch:28},{wch:10},{wch:10},{wch:14},{wch:10},{wch:10}];
  ws3['!cols'] = [{wch:6},{wch:12},{wch:10},{wch:12},{wch:12},{wch:8},{wch:24}];
  ws4['!cols'] = [{wch:8},{wch:8},{wch:20},{wch:12},{wch:12},{wch:20},{wch:12},{wch:12}];
  ws5['!cols'] = [{wch:24},{wch:8},{wch:12},{wch:12},{wch:12},
                  {wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws1, 'サマリー');
  XLSX.utils.book_append_sheet(wb, ws2, '路線別結果');
  XLSX.utils.book_append_sheet(wb, ws3, '経路');
  XLSX.utils.book_append_sheet(wb, ws4, '工事・迂回');
  XLSX.utils.book_append_sheet(wb, ws5, '車線');

  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  return new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
// ================= GitHub通信 =================
function apiUrl(path){
  return `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/` +
         path.split('/').map(encodeURIComponent).join('/');
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload  = ()=> resolve(r.result.split(',')[1]);
    r.onerror = ()=> reject(new Error('ファイル変換に失敗'));
    r.readAsDataURL(blob);
  });
}
function textToBase64(text){
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  bytes.forEach(b=> bin += String.fromCharCode(b));
  return btoa(bin);
}

async function uploadToGitHub(fileName, blob, token){
  const path = `${GH_FOLDER}/${fileName}`;
  const content = await blobToBase64(blob);
  const res = await fetch(apiUrl(path), {
    method:'PUT',
    headers:{
      'Authorization':'Bearer ' + token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json'
    },
    body: JSON.stringify({message:`踏査結果を追加：${fileName}`, content, branch:GH_BRANCH})
  });
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json()).message; }catch(e){}
    throw new Error(`${fileName}（HTTP ${res.status} ${detail}）`);
  }
}

// progress.json は上書き更新（既存のshaが必要）
async function uploadProgress(token){
  const path = `${GH_FOLDER}/${PROGRESS_FILE}`;
  const headers = {'Authorization':'Bearer ' + token,'Accept':'application/vnd.github+json'};
  let sha = null;
  const cur = await fetch(apiUrl(path) + '?ref=' + GH_BRANCH + '&t=' + Date.now(), {headers});
  if(cur.ok){ sha = (await cur.json()).sha; }
  const body = {
    message:'踏査記録を更新',
    content:textToBase64(JSON.stringify(collectProgress())),
    branch:GH_BRANCH
  };
  if(sha) body.sha = sha;
  const res = await fetch(apiUrl(path), {
    method:'PUT', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json()).message; }catch(e){}
    throw new Error(`${PROGRESS_FILE}（HTTP ${res.status} ${detail}）`);
  }
}
