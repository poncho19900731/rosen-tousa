<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="路線踏査">
<title>路線踏査アプリ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  html, body { margin:0; height:100%; font-family:sans-serif; }
  #header { padding:8px; background:#f4f4f4; border-bottom:1px solid #ccc; }
  #header button { font-size:15px; padding:8px 12px; margin:2px; }
  #btnStart { background:#2a9d4a; color:#fff; border:none; border-radius:4px; }
  #btnEnd   { background:#d62a2a; color:#fff; border:none; border-radius:4px; }
  button:disabled { opacity:0.4; }
  #info { font-size:13px; margin-top:4px; }
  #map { position:absolute; top:96px; left:0; right:0; bottom:0; }
  .routeLabel { background:#fff; border:3px solid #333; border-radius:50%;
                text-align:center; font-weight:bold; box-sizing:border-box; padding:0 3px; }
  .endLabel { min-width:30px; height:30px; line-height:24px; font-size:13px;
              border-width:4px; background:#ffffe0; }
  .midLabel { min-width:22px; height:22px; line-height:16px; font-size:10px; }
  .currentDot { width:22px; height:22px; border-radius:50%; background:#d62a2a;
                border:4px solid #fff; box-sizing:border-box;
                box-shadow:0 0 0 3px rgba(214,42,42,0.45), 0 0 8px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div id="header">
  <button id="btnStart" disabled>調査開始</button>
  <button id="btnEnd" disabled>調査終了</button>
  <div id="info">読み込み中...</div>
</div>
<div id="map"></div>

<script>
// ================= 設定 =================
const LIST_FILE = 'list.json';   // KMLファイル名の一覧
const THRESHOLD_M = 15;          // ラインからこの距離以内の点だけ判定する
const MAX_ACCURACY_M = 25;       // GPS精度がこれより悪い点は無視する
const UNIT_M = 50;               // 最小単位（小区間）の長さ(m)
const GAP_FILL_UNITS = 3;        // 飛んだ小区間がこの数以内なら間を補完する
const ADJACENT_M = 30;           // この距離以内なら「隣接」とみなす（色分け用）
const LABEL_INTERVAL_M = 1000;   // 途中の番号を置く間隔(m)
const LINE_WEIGHT = 6;           // 路線の線の太さ
const LINE_OPACITY = 0.85;       // 未踏査の線の濃さ
const COLORS = [
  '#e6194b','#3cb44b','#4363d8','#f58231','#911eb4',
  '#008b8b','#9a6324','#d2007a','#808000','#000075',
  '#46a0f0','#f032e6','#7fb800','#800000','#555555'
];

// ---- GitHub保存の設定 ----
const GH_OWNER  = 'poncho19900731';
const GH_REPO   = 'rosen-tousa';
const GH_BRANCH = 'main';
const GH_FOLDER = 'results';

// トークンはコードに書かず、調査終了のたびに入力する
function getToken(){
  const t = prompt('GitHubのトークン（github_pat_...）を貼り付けてください。\nキャンセルすると、GitHubへの保存は行わず端末にだけ保存します。');
  return t ? t.trim() : '';
}

// ================= 状態 =================
let segments = [];
let surveying = false;
let watchId = null;
let trackPoints = [];
let startTime = null;
let currentMarker = null;
let trackLine = null;
let lastUnit = null;   // 直前に踏んだ小区間 {seg, idx}

// ================= 地図 =================
const map = L.map('map').setView([24.78, 125.33], 11);

// ===== 重ね順（数字が大きいほど上） =====
map.createPane('routePane');   map.getPane('routePane').style.zIndex = 400;  // 路線（未踏査）
map.createPane('walkedPane');  map.getPane('walkedPane').style.zIndex = 450;  // 踏査済みライン
map.createPane('labelPane');   map.getPane('labelPane').style.zIndex = 500;   // 番号ラベル
map.createPane('trackPane');   map.getPane('trackPane').style.zIndex = 900;   // 通過した軌跡
map.createPane('currentPane'); map.getPane('currentPane').style.zIndex = 950; // 現在地（最上層）

const baseLayers = {
  '淡色地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
              {attribution:'地理院タイル', maxZoom:18}),
  '標準地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
              {attribution:'地理院タイル', maxZoom:18}),
  '航空写真': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
              {attribution:'地理院タイル', maxZoom:18}),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
              {attribution:'© OpenStreetMap contributors', maxZoom:19})
};
baseLayers['淡色地図'].addTo(map);
L.control.layers(baseLayers, null, {position:'topright'}).addTo(map);

// ================= 便利関数 =================
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDT(d){
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtStamp(d){
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
// 先頭の見えない文字（BOM）を取り除く
function stripBom(s){ return s.replace(/^\uFEFF/, ''); }

// 区間の始点と終点を取り出す（1か所に統一）
function endpoints(line){
  const c = line.geometry.coordinates;
  return [c[0], c[c.length-1]];
}

// ================= KMLの解析 =================
function parseKmlText(text){
  const xml = new DOMParser().parseFromString(stripBom(text),'text/xml');
  if(xml.querySelector('parsererror')) throw new Error('KMLの形式が不正です');
  const geojson = toGeoJSON.kml(xml);
  const lines = [];
  geojson.features.forEach((f,i)=>{
    if(!f.geometry) return;
    const name = f.properties.name || ('route_'+(i+1));
    if(f.geometry.type==='LineString'){
      lines.push({name, line:turf.lineString(f.geometry.coordinates)});
    }else if(f.geometry.type==='MultiLineString'){
      f.geometry.coordinates.forEach(c=>lines.push({name, line:turf.lineString(c)}));
    }
  });
  return lines;
}

// 「（way ○○）」と末尾の「_1」を除いた路線名
function baseName(name){
  return name.replace(/（way\s*\d+）/g,'').replace(/\(way\s*\d+\)/g,'')
             .replace(/_\d+\s*$/,'').trim();
}

// ================= 起動時にKMLをすべて読み込む =================
async function loadAll(){
  const info = document.getElementById('info');
  let names;
  try{
    const res = await fetch(LIST_FILE + '?t=' + Date.now());
    if(!res.ok) throw new Error('list.json が見つかりません（HTTP ' + res.status + '）');
    const txt = await res.text();
    names = JSON.parse(stripBom(txt));
  }catch(e){
    info.textContent = 'list.json の読み込みに失敗：' + e.message;
    return;
  }
  if(!Array.isArray(names) || !names.length){
    info.textContent = 'list.json にKMLが登録されていません';
    return;
  }

  const list = [];
  const errors = [];
  let count = 0;
  for(const fname of names){
    count++;
    info.textContent = `読み込み中... ${count} / ${names.length}`;
    try{
      const res = await fetch(encodeURI(fname) + '?t=' + Date.now());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = stripBom(await res.text());
      const lines = parseKmlText(text);
      if(!lines.length) throw new Error('線が見つかりません');
      lines.forEach(o=>{
        const len = turf.length(o.line,{units:'meters'});
        const unitCount = Math.max(1, Math.ceil(len / UNIT_M));
        // 外接矩形（判定の絞り込み用）：[minX, minY, maxX, maxY]
        const bbox = turf.bbox(o.line);
        list.push({
          route: baseName(o.name),
          part: o.name,
          file: fname,
          line: o.line,
          bbox: bbox,
          length: len,
          unitCount: unitCount,
          unitWalked: new Array(unitCount).fill(false), // 小区間ごとの踏査状態
          layer: null,
          walkedLayers: [],   // 小区間ごとの踏査済みライン
          label: null,
          walked: false,
          color: '#999'
        });
      });
    }catch(e){
      errors.push(fname + '：' + e.message);
    }
  }
  segments = list;
  info.textContent = '地図を作成中...';
  buildMap();
  if(errors.length) alert('読み込めなかったKML\n' + errors.join('\n'));
}

// ================= 隣接判定（区間どうし・色分け用） =================
function isAdjacent(a, b){
  if(a.route === b.route) return false;
  const ea = endpoints(a.line), eb = endpoints(b.line);

  for(const pa of ea){
    for(const pb of eb){
      const d = turf.distance(turf.point(pa), turf.point(pb), {units:'meters'});
      if(d <= ADJACENT_M) return true;
    }
  }
  for(const pa of ea){
    const near = turf.nearestPointOnLine(b.line, turf.point(pa), {units:'meters'});
    if(near.properties.dist <= ADJACENT_M) return true;
  }
  for(const pb of eb){
    const near = turf.nearestPointOnLine(a.line, turf.point(pb), {units:'meters'});
    if(near.properties.dist <= ADJACENT_M) return true;
  }
  return false;
}

// ================= 色の割り当て =================
function assignColors(){
  const routeMap = {};
  segments.forEach((s,i)=>{
    (routeMap[s.route] = routeMap[s.route] || []).push(i);
  });
  const routeNames = Object.keys(routeMap);

  const adj = {};
  routeNames.forEach(r=>adj[r] = new Set());

  for(let a=0; a<routeNames.length; a++){
    for(let b=a+1; b<routeNames.length; b++){
      const ra = routeNames[a], rb = routeNames[b];
      let touch = false;
      for(const i of routeMap[ra]){
        for(const j of routeMap[rb]){
          if(isAdjacent(segments[i], segments[j])){ touch = true; break; }
        }
        if(touch) break;
      }
      if(touch){ adj[ra].add(rb); adj[rb].add(ra); }
    }
  }

  const order = routeNames.slice().sort((x,y)=>adj[y].size - adj[x].size);
  const colorOf = {};
  order.forEach(r=>{
    const used = new Set();
    adj[r].forEach(n=>{
      if(colorOf[n] !== undefined) used.add(colorOf[n]);
    });
    let c = 0;
    while(used.has(c)) c++;
    colorOf[r] = c;
  });

  segments.forEach(s=>{
    s.colorIdx = colorOf[s.route];
    s.color = COLORS[s.colorIdx % COLORS.length];
  });
}

// ================= 番号ラベルを作る =================
function makeLabel(lat, lng, num, color, isEnd){
  const size = isEnd ? 30 : 22;
  return L.marker([lat,lng],{
    pane:'labelPane',
    icon:L.divIcon({className:'',
      html:`<div class="routeLabel ${isEnd?'endLabel':'midLabel'}" style="border-color:${color}">${esc(num)}</div>`,
      iconSize:[size,size]}),
    interactive:false
  });
}

// ================= 小区間の座標を取り出す =================
function unitLatLngs(s, idx){
  const from = idx * UNIT_M;
  const to = Math.min((idx + 1) * UNIT_M, s.length);
  if(to <= from) return [];
  const part = turf.lineSliceAlong(s.line, from/1000, to/1000, {units:'kilometers'});
  return part.geometry.coordinates.map(c=>[c[1],c[0]]);
}

// ================= 地図に描く =================
function buildMap(){
  segments.forEach(s=>{
    if(s.layer) map.removeLayer(s.layer);
    s.walkedLayers.forEach(l=>{ if(l) map.removeLayer(l); });
    s.walkedLayers = [];
    if(s.label) map.removeLayer(s.label);
  });

  assignColors();

  const placedEnds = {};

  segments.forEach((s,i)=>{
    const latlngs = s.line.geometry.coordinates.map(c=>[c[1],c[0]]);

    // 未踏査の線（下の層）
    s.layer = L.polyline(latlngs,{
      pane:'routePane', color:s.color, weight:LINE_WEIGHT, opacity:LINE_OPACITY
    }).addTo(map);

    // 踏査済みの小区間は、踏んだときに作る
    s.walkedLayers = new Array(s.unitCount).fill(null);

    const num = (s.route.match(/(\d+)/)||[,''])[1] || s.route.slice(0,2);
    const len = s.length;
    const group = L.layerGroup();
    placedEnds[s.route] = placedEnds[s.route] || [];

    endpoints(s.line).forEach(p=>{
      const dup = placedEnds[s.route].some(q=>
        turf.distance(turf.point(p), turf.point(q), {units:'meters'}) <= ADJACENT_M);
      if(dup) return;
      placedEnds[s.route].push(p);
      makeLabel(p[1], p[0], num, s.color, true).addTo(group);
    });

    for(let d = LABEL_INTERVAL_M; d < len - LABEL_INTERVAL_M/2; d += LABEL_INTERVAL_M){
      const p = turf.along(s.line, d, {units:'meters'}).geometry.coordinates;
      makeLabel(p[1], p[0], num, s.color, false).addTo(group);
    }

    s.label = group.addTo(map);
  });

  if(segments.length){
    map.fitBounds(L.featureGroup(segments.map(s=>s.layer)).getBounds());
    document.getElementById('btnStart').disabled = false;
  }
  updateInfo();
}

// 画面上部の集計表示
function updateInfo(){
  const el = document.getElementById('info');
  const routeCount = new Set(segments.map(s=>s.route)).size;
  let done = 0, totalUnits = 0, doneUnits = 0;
  segments.forEach(s=>{
    if(s.walked) done++;
    totalUnits += s.unitCount;
    doneUnits += s.unitDone || 0;
  });
  el.textContent = `路線 ${routeCount} 本 / 区間 ${segments.length} / 踏査済み区間 ${done} / 踏査済み ${doneUnits}/${totalUnits} 小区間`;
}

// ================= 小区間を「踏査済み」にする =================
function markUnit(s, idx){
  if(idx < 0 || idx >= s.unitCount) return;
  if(s.unitWalked[idx]) return;
  s.unitWalked[idx] = true;
  s.unitDone = (s.unitDone || 0) + 1;
  const ll = unitLatLngs(s, idx);
  if(ll.length >= 2){
    s.walkedLayers[idx] = L.polyline(ll,{
      pane:'walkedPane', color:s.color, weight:LINE_WEIGHT+2, opacity:1
    }).addTo(map);
  }
  // 区間のすべての小区間が踏査済みなら、区間も踏査済み
  if(s.unitDone >= s.unitCount) s.walked = true;
}

// ================= 調査（開始・終了） =================
document.getElementById('btnStart').addEventListener('click',()=>{
  if(!navigator.geolocation){ alert('この端末は位置情報に対応していません。'); return; }
  surveying = true;
  startTime = new Date();
  trackPoints = [];
  lastUnit = null;
  segments.forEach(s=>{
    s.walked = false;
    s.unitDone = 0;
    s.unitWalked = new Array(s.unitCount).fill(false);
    s.walkedLayers.forEach(l=>{ if(l) map.removeLayer(l); });
    s.walkedLayers = new Array(s.unitCount).fill(null);
  });
  if(trackLine){ map.removeLayer(trackLine); trackLine = null; }
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnEnd').disabled = false;
  updateInfo();

  watchId = navigator.geolocation.watchPosition(onPosition, onGeoError,
    {enableHighAccuracy:true, maximumAge:0, timeout:20000});
});

function onGeoError(err){
  document.getElementById('info').textContent = '位置情報エラー：' + err.message;
}

// 現在地から最も近い1区間と、そのライン上の位置を求める
// （外接矩形で、遠い区間は計算を飛ばす）
function findNearest(pt){
  const [x, y] = pt.geometry.coordinates;
  // しきい値(m)を、緯度経度の度数に換算（余裕を持たせる）
  const marginY = (THRESHOLD_M * 1.5) / 111000;
  const marginX = marginY / Math.max(0.2, Math.cos(y * Math.PI / 180));

  let best = null;
  segments.forEach(s=>{
    const b = s.bbox;
    if(x < b[0] - marginX || x > b[2] + marginX ||
       y < b[1] - marginY || y > b[3] + marginY) return;

    const np = turf.nearestPointOnLine(s.line, pt, {units:'meters'});
    const dist = np.properties.dist;
    if(dist > THRESHOLD_M) return;
    if(!best || dist < best.dist){
      best = {seg:s, dist:dist, loc:np.properties.location}; // loc：区間の始点からの距離(m)
    }
  });
  return best;
}

function onPosition(pos){
  const {latitude:lat, longitude:lng, accuracy} = pos.coords;
  if(accuracy > MAX_ACCURACY_M) return;

  trackPoints.push({lat, lng, time:new Date(pos.timestamp), accuracy});

  // 現在地マーク（最上層・HTMLマーカー）
  if(!currentMarker){
    currentMarker = L.marker([lat,lng],{
      pane:'currentPane',
      icon:L.divIcon({
        className:'',
        html:'<div class="currentDot"></div>',
        iconSize:[22,22],
        iconAnchor:[11,11]
      }),
      interactive:false,
      zIndexOffset:10000
    }).addTo(map);
  }else currentMarker.setLatLng([lat,lng]);
  map.panTo([lat,lng]);

  // 通過した軌跡（赤の点線）
  const pts = trackPoints.map(p=>[p.lat,p.lng]);
  if(!trackLine){
    trackLine = L.polyline(pts,{pane:'trackPane',color:'#d62a2a',weight:5,dashArray:'6 6'}).addTo(map);
  }else{
    trackLine.setLatLngs(pts);
  }

  // 踏査判定：最も近い1区間の、ライン上の点だけを使う
  const pt = turf.point([lng,lat]);
  const hit = findNearest(pt);
  if(hit){
    const s = hit.seg;
    const idx = Math.min(s.unitCount - 1, Math.floor(hit.loc / UNIT_M));
    judgeUnit(s, idx);
  }
  updateInfo();
}

// 隣接する小区間を連続して踏んだときだけ「踏査済み」にする
function judgeUnit(s, idx){
  if(lastUnit && lastUnit.seg === s){
    const diff = idx - lastUnit.idx;
    if(Math.abs(diff) <= 1){
      // 同じ小区間、または隣り合う小区間 → 確定
      markUnit(s, lastUnit.idx);
      markUnit(s, idx);
    }else if(Math.abs(diff) <= GAP_FILL_UNITS){
      // 少し飛んだ → 間を補完して確定
      const from = Math.min(lastUnit.idx, idx);
      const to = Math.max(lastUnit.idx, idx);
      for(let k = from; k <= to; k++) markUnit(s, k);
    }
    // 大きく飛んだ場合は確定せず、新しい起点にする
  }
  // 別の区間に移った場合も、確定せず新しい起点にする
  lastUnit = {seg:s, idx:idx};
}

document.getElementById('btnEnd').addEventListener('click', async()=>{
  if(!confirm('調査を終了してファイルを出力しますか？')) return;
  if(watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  surveying = false;
  const endTime = new Date();

  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnEnd').disabled = true;

  const stamp = fmtStamp(startTime);
  const kmlName  = `踏査軌跡_${stamp}.kml`;
  const xlsxName = `踏査結果_${stamp}.xlsx`;

  const kmlBlob  = new Blob([buildKml(startTime,endTime)],{type:'application/vnd.google-earth.kml+xml'});
  const xlsxBlob = buildXlsx(startTime, endTime, kmlName, xlsxName);

  // ① GitHubへ保存（トークンを入力した場合のみ）
  const info = document.getElementById('info');
  const token = getToken();
  let ghMsg = '';
  if(token){
    info.textContent = 'GitHubに保存中...';
    try{
      await uploadToGitHub(kmlName,  kmlBlob,  token);
      await uploadToGitHub(xlsxName, xlsxBlob, token);
      ghMsg = `GitHubに保存しました（${GH_FOLDER}フォルダ）`;
    }catch(e){
      ghMsg = 'GitHub保存に失敗：' + e.message;
    }
  }else{
    ghMsg = 'トークン未入力のため、GitHubへの保存はしませんでした';
  }
  info.textContent = ghMsg;
  alert(ghMsg);

  // ② 端末にも保存
  await saveFiles([
    new File([xlsxBlob], xlsxName, {type:xlsxBlob.type}),
    new File([kmlBlob],  kmlName,  {type:kmlBlob.type})
  ]);
});

// ================= 出力 =================
function buildKml(st,en){
  const coords = trackPoints.map(p=>`${p.lng},${p.lat},0`).join(' ');
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>踏査軌跡_${fmtStamp(st)}</name>
<description>開始 ${fmtDT(st)} / 終了 ${fmtDT(en)}</description>
<Placemark><name>踏査軌跡</name>
<Style><LineStyle><color>ff0000ff</color><width>3</width></LineStyle></Style>
<LineString><tessellate>1</tessellate><coordinates>${coords}</coordinates></LineString>
</Placemark></Document></kml>`;
}

function buildXlsx(st, en, kmlName, xlsxName){
  const minutes = Math.round((en - st) / 60000);
  const files = [...new Set(segments.map(s=>s.file))];
  const touched = segments.filter(s=>(s.unitDone||0) > 0).length;

  const summary = [
    ['項目','内容'],
    ['保存ファイル名（Excel）', xlsxName],
    ['保存ファイル名（軌跡KML）', kmlName],
    ['調査開始', fmtDT(st)],
    ['調査終了', fmtDT(en)],
    ['所要時間（分）', minutes],
    ['記録した点の数', trackPoints.length],
    ['路線数', new Set(segments.map(s=>s.route)).size],
    ['区間数', segments.length],
    ['全区間を踏査済みの区間数', segments.filter(s=>s.walked).length],
    ['一部でも踏査した区間数', touched],
    ['使用したKML', files.join(' / ')]
  ];

  const detail = [['路線名','区間名','元のKMLファイル','延長(m)','小区間数','踏査済み小区間','踏査率(%)','踏査結果']];
  segments.forEach(s=>{
    const doneU = s.unitDone || 0;
    const rate = Math.round(doneU / s.unitCount * 100);
    const result = s.walked ? '踏査済み' : (doneU > 0 ? '一部踏査' : '未踏査');
    detail.push([
      s.route, s.part, s.file,
      Math.round(s.length),
      s.unitCount, doneU, rate, result
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  const ws2 = XLSX.utils.aoa_to_sheet(detail);
  ws1['!cols'] = [{wch:28},{wch:60}];
  ws2['!cols'] = [{wch:24},{wch:34},{wch:28},{wch:10},{wch:10},{wch:14},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws1, 'サマリー');
  XLSX.utils.book_append_sheet(wb, ws2, '路線別結果');

  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  return new Blob([out],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ================= GitHubへアップロード =================
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload  = ()=> resolve(r.result.split(',')[1]);
    r.onerror = ()=> reject(new Error('ファイル変換に失敗'));
    r.readAsDataURL(blob);
  });
}

async function uploadToGitHub(fileName, blob, token){
  const path = `${GH_FOLDER}/${fileName}`;
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/` +
              path.split('/').map(encodeURIComponent).join('/');
  const content = await blobToBase64(blob);

  const res = await fetch(url, {
    method:'PUT',
    headers:{
      'Authorization':'Bearer ' + token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json'
    },
    body: JSON.stringify({
      message: `踏査結果を追加：${fileName}`,
      content: content,
      branch: GH_BRANCH
    })
  });
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json()).message; }catch(e){}
    throw new Error(`${fileName}（HTTP ${res.status} ${detail}）`);
  }
}

async function saveFiles(files){
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:'踏査結果'}); return; }
    catch(e){ /* キャンセル時はダウンロードへ */ }
  }
  files.forEach(f=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
  });
}

loadAll().catch(e=>{
  document.getElementById('info').textContent = '読み込みエラー：' + e.message;
});
